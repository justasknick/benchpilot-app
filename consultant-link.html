<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <!-- The consultant self-service link (migration 0056). Opened WITHOUT an account. Same CSP as index.html: scripts and styles from this
       site only, connect-src the Supabase project only (the `team` function's public link-view / link-respond actions). The token is in the
       #fragment (never sent to a server by the browser), it is removed from the address bar at once, and no-referrer keeps it out of
       every Referer header. noindex: the page has nothing for a search engine. -->
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self'; style-src 'self'; img-src 'self' data:; font-src 'self'; connect-src https://uhgtlyxarozzdgdizoaz.supabase.co; frame-src 'none'; worker-src 'none'; form-action 'none'; base-uri 'none'; object-src 'none'">
  <meta name="referrer" content="no-referrer">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Confirm your details</title>
  <meta name="robots" content="noindex, nofollow">
  <link rel="icon" type="image/svg+xml" href="shared/icons/logo-mark.svg">
  <link rel="stylesheet" href="shared/lib/tokens.css">
  <link rel="stylesheet" href="shared/lib/tokens-pages.css">
  <link rel="stylesheet" href="css/app.css">
</head>
